name: Calendly Lakehouse CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Lint (Ruff) & Unit Tests (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --prefer-binary -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src/ tests/

      - name: Run Pytest unit test suite
        run: pytest -v

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform (no backend)
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  deploy-code-artifacts:
    name: Sync Lambda & Glue Code with GitHub SHA to S3
    needs: [lint-and-test, terraform-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::440107864885:role/calendly-lakehouse-prod-github-deploy-role' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Package and upload Ingestion Lambda & Glue PySpark scripts with GitHub SHA directory names
        env:
          GLUE_SCRIPTS_BUCKET: ${{ secrets.S3_GLUE_SCRIPTS_BUCKET || 'calendly-lakehouse-prod-glue-scripts' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          mkdir -p "build/ingestion_lambda_${GITHUB_SHA}"
          cd src/ingestion_lambda && zip -r "../../build/ingestion_lambda_${GITHUB_SHA}/ingestion_lambda.zip" . && cd ../..

          aws s3 sync "build/ingestion_lambda_${GITHUB_SHA}/" \
            "s3://${GLUE_SCRIPTS_BUCKET}/ingestion_lambda_${GITHUB_SHA}/" \
            --delete

          aws s3 sync src/glue_jobs/ \
            "s3://${GLUE_SCRIPTS_BUCKET}/glue_jobs_${GITHUB_SHA}/" \
            --exclude "__pycache__/*" \
            --exclude "*.pyc" \
            --delete

