name: Calendly Lakehouse CI/CD Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  lint-and-test:
    name: Lint (Ruff) & Unit Tests (Pytest) with uv
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and set up Python 3.12 with cache
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies and pre-build Lambda + Glue bundles with uv
        run: |
          uv sync --extra dev
          uv run python scripts/build_artifacts.py

      - name: Run Ruff linter
        run: uv run ruff check src/ tests/ scripts/

      - name: Run Pytest unit test suite
        run: uv run pytest -v

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Pre-build Lambda and Glue dependency bundles with uv
        working-directory: .
        run: uv run python scripts/build_artifacts.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Check Terraform formatting
        run: terraform fmt -check

      - name: Initialize Terraform (no backend)
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate

  deploy-code-artifacts:
    name: Sync Pre-Built Lambda & Glue Bundles with GitHub SHA to S3
    needs: [lint-and-test, terraform-validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::440107864885:role/calendly-lakehouse-prod-github-deploy-role' }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Pre-build and upload Lambda & Glue bundles with GitHub SHA directory names
        env:
          GLUE_SCRIPTS_BUCKET: ${{ secrets.S3_GLUE_SCRIPTS_BUCKET || 'calendly-lakehouse-prod-glue-scripts' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          uv run python scripts/build_artifacts.py

          mkdir -p "build/ingestion_lambda_${GITHUB_SHA}"
          cp dist/ingestion_lambda.zip "build/ingestion_lambda_${GITHUB_SHA}/"

          aws s3 sync "build/ingestion_lambda_${GITHUB_SHA}/" \
            "s3://${GLUE_SCRIPTS_BUCKET}/ingestion_lambda_${GITHUB_SHA}/" \
            --delete

          mkdir -p "build/glue_jobs_${GITHUB_SHA}"
          cp src/glue_jobs/*.py "build/glue_jobs_${GITHUB_SHA}/"
          cp dist/glue_dependencies.zip "build/glue_jobs_${GITHUB_SHA}/"
          cp dist/calendly_lakehouse-0.1.0-py3-none-any.whl "build/glue_jobs_${GITHUB_SHA}/"

          aws s3 sync "build/glue_jobs_${GITHUB_SHA}/" \
            "s3://${GLUE_SCRIPTS_BUCKET}/glue_jobs_${GITHUB_SHA}/" \
            --delete
