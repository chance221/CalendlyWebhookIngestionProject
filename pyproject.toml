[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calendly-lakehouse"
version = "0.1.0"
description = "Serverless AWS Data Lakehouse (Apache Iceberg) for Calendly Webhook & Campaign Spend Attribution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5.0",
]
dashboard = [
    "streamlit>=1.32.0",
    "pyiceberg[s3fs,glue,pyarrow]>=0.7.0",
    "pandas>=2.2.2",
    "plotly>=5.18.0",
    "altair>=5.2.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
